services:
  db:
    image: postgres:16-alpine
    container_name: haprvisual-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haprvisual
    ports:
      - "5432:5432"
    volumes:
      - haprvisual-pgdata:/var/lib/postgresql/data

volumes:
  haprvisual-pgdata: